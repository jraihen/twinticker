<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101a2e" />
    <title>TwinTicker — 두 자산, 하나의 기준</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar"><a class="brand" href="./"><span>TT</span>TwinTicker <em>alpha</em></a><div class="market-status"><i></i>미국 시장 <b>정규장 마감</b><small>· 15분 지연 데이터</small></div><button class="icon-button" aria-label="설정">⚙</button></header>
    <main>
      <section class="hero"><p class="eyebrow">COMPARE WITH CLARITY</p><h1>두 자산, <span>하나의 기준</span></h1><p>같은 시간축 위에서 성과의 차이를 빠르게 확인하세요.</p></section>
      <section class="compare-panel" aria-label="자산 비교"><div id="asset-pair" class="asset-pair"></div><div class="range-row"><div id="range-tabs" class="range-tabs" aria-label="비교 기간"></div><span class="data-note">마지막 업데이트 <b>오늘 16:12 KST</b></span></div></section>
      <section class="chart-panel"><div class="chart-header"><div><p class="panel-label">NORMALIZED RETURN</p><h2>정규화 수익률 <small>시작값 100</small></h2></div><div id="chart-summary" class="chart-summary"></div></div><div id="chart" class="chart"></div></section>
      <section id="insight" class="insight"></section>
      <section id="metrics" class="metrics" aria-label="비교 지표"></section>
      <p class="disclaimer">TwinTicker는 비교와 관찰을 위한 도구이며 투자 조언을 제공하지 않습니다. 알파 버전의 시세는 체험용 목업 데이터입니다.</p>
    </main>
    <dialog id="picker"><div class="dialog-head"><div><p class="panel-label">ASSET SELECTOR</p><h2 id="picker-title">자산 선택</h2></div><button id="picker-close" class="icon-button" aria-label="닫기">×</button></div><div id="asset-options" class="asset-options"></div><p class="dialog-note">알파 버전에서는 미국 주식과 ETF 예시만 제공합니다.</p></dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
